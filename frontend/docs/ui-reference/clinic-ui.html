document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Vazirmatn';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"e5a6c8a6-27cf-4c65-bb52-d83fefc1d793\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   MB AMC — Color tokens\n   Brand identity colors come from the MB logo (electric MB Blue\n   + the red pinwheel). The interactive UI palette follows the\n   corporate \"trust blue\" brief (#0066B3 family) with a navy ink,\n   cool neutrals, and a gold opportunity accent.\n   ============================================================ */\n:root {\n  /* --- Brand identity (logo) — use sparingly, for the mark & key brand moments --- */\n  --mb-blue: #141ED2;        /* electric royal blue in the MB wordmark */\n  --mb-blue-ink: #0F18A8;    /* darker pressed variant of mb-blue */\n  --mb-red: #EB2D4B;         /* the MB pinwheel red */\n  --mb-red-ink: #C71F3B;\n\n  /* --- Primary: corporate trust blue (interactive system color) --- */\n  --blue-50:  #E8F1FA;\n  --blue-100: #CCE0F2;\n  --blue-200: #99C2E5;\n  --blue-300: #66A3D9;\n  --blue-400: #3385CC;\n  --blue-500: #0066B3;   /* primary */\n  --blue-600: #005BAC;   /* hover */\n  --blue-700: #004C8F;   /* active/pressed */\n  --blue-800: #003D73;\n  --blue-900: #0F2B46;   /* dark navy — authority */\n\n  /* --- Navy (authority / deep surfaces & ink) --- */\n  --navy-900: #0F2B46;\n  --navy-800: #163A5C;\n  --navy-700: #1E4B73;\n\n  /* --- Neutrals: cool, faintly blue-tinted grays --- */\n  --gray-0:   #FFFFFF;\n  --gray-50:  #F5F7FA;   /* light gray app background */\n  --gray-100: #EDF1F6;\n  --gray-200: #DCE3EC;   /* hairline borders */\n  --gray-300: #C2CCD9;\n  --gray-400: #97A4B5;   /* disabled / placeholder */\n  --gray-500: #6B7888;   /* muted text */\n  --gray-600: #4D5A6B;   /* secondary text */\n  --gray-700: #36424F;\n  --gray-800: #1F2A38;\n  --gray-900: #0F1A28;   /* primary ink */\n\n  /* --- Gold: opportunity / assets / highlight accent --- */\n  --gold-50:  #FEF6E7;\n  --gold-100: #FCE8C2;\n  --gold-200: #F9D285;\n  --gold-500: #F5A623;   /* accent */\n  --gold-600: #DB8E12;\n  --gold-700: #B5720C;\n\n  /* --- Semantic scales --- */\n  --green-50:  #E6F6EF;\n  --green-100: #C2E9D7;\n  --green-500: #1E9E6A;  /* success / gains */\n  --green-600: #178055;\n  --green-700: #126645;\n\n  --red-50:   #FDEAED;\n  --red-100:  #F9C7CF;\n  --red-500:  #EB2D4B;   /* danger / losses (= MB red) */\n  --red-600:  #C71F3B;\n  --red-700:  #A0182F;\n\n  --amber-500: #F5A623;  /* warning (= gold) */\n\n  /* ============================================================\n     Semantic aliases — reference these in components/UI, not raw scales\n     ============================================================ */\n  /* Text / ink */\n  --text-strong:   var(--navy-900);\n  --text-body:     var(--gray-800);\n  --text-secondary:var(--gray-600);\n  --text-muted:    var(--gray-500);\n  --text-disabled: var(--gray-400);\n  --text-inverse:  var(--gray-0);\n  --text-link:     var(--blue-600);\n  --text-brand:    var(--blue-500);\n\n  /* Surfaces */\n  --surface-page:    var(--gray-50);\n  --surface-card:    var(--gray-0);\n  --surface-sunken:  var(--gray-100);\n  --surface-hover:   var(--gray-100);\n  --surface-active:  var(--blue-50);\n  --surface-inverse: var(--navy-900);\n  --surface-brand:   var(--blue-500);\n\n  /* Borders */\n  --border-subtle:  var(--gray-200);\n  --border-default: var(--gray-300);\n  --border-strong:  var(--gray-400);\n  --border-focus:   var(--blue-500);\n\n  /* Interactive — primary action */\n  --action-primary:        var(--blue-500);\n  --action-primary-hover:  var(--blue-600);\n  --action-primary-active: var(--blue-700);\n  --action-primary-text:   var(--gray-0);\n\n  /* Interactive — accent / opportunity (gold) */\n  --action-accent:        var(--gold-500);\n  --action-accent-hover:  var(--gold-600);\n  --action-accent-active: var(--gold-700);\n  --action-accent-text:   var(--navy-900);\n\n  /* Focus ring */\n  --focus-ring: color-mix(in srgb, var(--blue-500) 40%, transparent);\n\n  /* Status */\n  --status-success:    var(--green-500);\n  --status-success-bg: var(--green-50);\n  --status-warning:    var(--amber-500);\n  --status-warning-bg: var(--gold-50);\n  --status-danger:     var(--red-500);\n  --status-danger-bg:  var(--red-50);\n  --status-info:       var(--blue-500);\n  --status-info-bg:    var(--blue-50);\n\n  /* Data-viz categorical sequence (charts) */\n  --viz-1: var(--blue-500);\n  --viz-2: var(--gold-500);\n  --viz-3: var(--green-500);\n  --viz-4: var(--mb-blue);\n  --viz-5: var(--navy-700);\n  --viz-6: var(--gray-400);\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   MB AMC — Spacing, radius, shadow, motion, z-index\n   8px base grid. Structured, generous whitespace for clarity.\n   ============================================================ */\n:root {\n  /* Spacing scale (4px atom, 8px base rhythm) */\n  --space-0: 0;\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n\n  /* Layout */\n  --container-max: 1280px;\n  --gutter: 24px;\n  --sidebar-w: 260px;\n\n  /* Radius — restrained, professional (not pill-heavy) */\n  --radius-xs: 4px;\n  --radius-sm: 6px;\n  --radius-md: 8px;     /* default for cards, inputs, buttons */\n  --radius-lg: 12px;    /* large cards, modals */\n  --radius-xl: 16px;\n  --radius-pill: 999px; /* badges, avatars, segmented toggles */\n\n  /* Border widths */\n  --border-width: 1px;\n  --border-width-strong: 1.5px;\n\n  /* Shadows — soft, cool-tinted, financial-grade restraint */\n  --shadow-xs:  0 1px 2px rgba(15, 43, 70, 0.06);\n  --shadow-sm:  0 1px 3px rgba(15, 43, 70, 0.08), 0 1px 2px rgba(15, 43, 70, 0.04);\n  --shadow-md:  0 4px 12px rgba(15, 43, 70, 0.08), 0 2px 4px rgba(15, 43, 70, 0.04);\n  --shadow-lg:  0 12px 28px rgba(15, 43, 70, 0.12), 0 4px 8px rgba(15, 43, 70, 0.05);\n  --shadow-xl:  0 24px 56px rgba(15, 43, 70, 0.16);\n  --shadow-focus: 0 0 0 3px var(--focus-ring);\n  --shadow-inset: inset 0 1px 2px rgba(15, 43, 70, 0.06);\n\n  /* Motion — subtle, precise, no bounce */\n  --ease-standard: cubic-bezier(0.2, 0, 0, 1); /* @kind other */\n  --ease-emphasized: cubic-bezier(0.2, 0, 0, 1); /* @kind other */\n  --ease-out: cubic-bezier(0, 0, 0.2, 1); /* @kind other */\n  --duration-fast: 120ms; /* @kind other */\n  --duration-base: 180ms; /* @kind other */\n  --duration-slow: 280ms; /* @kind other */\n\n  /* Z-index ladder */\n  --z-base: 0; /* @kind other */\n  --z-sticky: 100; /* @kind other */\n  --z-dropdown: 400; /* @kind other */\n  --z-overlay: 800; /* @kind other */\n  --z-modal: 900; /* @kind other */\n  --z-toast: 1000; /* @kind other */\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   MB AMC — Typography tokens\n   Type ramp tuned for a data-first financial product: tight,\n   confident display sizes; highly legible body; tabular figures\n   for all numeric/money contexts.\n   ============================================================ */\n:root {\n  /* Families */\n  --font-sans: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\n  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;\n  --font-display: var(--font-sans);\n  --font-body: var(--font-sans);\n\n  /* Weights */\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n  --weight-extrabold: 800;\n\n  /* Type scale (1.250 major-third-ish, tuned) — font-size / line-height */\n  --text-display-lg: 56px;  --lh-display-lg: 60px;  /* hero numerals, landing */\n  --text-display:    44px;  --lh-display:    48px;\n  --text-h1:         34px;  --lh-h1:         40px;\n  --text-h2:         28px;  --lh-h2:         34px;\n  --text-h3:         22px;  --lh-h3:         28px;\n  --text-h4:         18px;  --lh-h4:         24px;\n  --text-body-lg:    16px;  --lh-body-lg:    24px;\n  --text-body:       15px;  --lh-body:       22px;\n  --text-sm:         13px;  --lh-sm:         18px;\n  --text-xs:         12px;  --lh-xs:         16px;\n  --text-overline:   11px;  --lh-overline:   14px;\n\n  /* Letter-spacing */\n  --tracking-display: -0.02em;  /* tighten large display */\n  --tracking-heading: -0.01em;\n  --tracking-normal: 0;\n  --tracking-wide: 0.04em;      /* overlines, eyebrows */\n  --tracking-caps: 0.08em;      /* all-caps labels */\n\n  /* Numeric: tabular figures for money/data alignment */\n  --numeric-tabular: 'tnum' 1, 'lnum' 1; /* @kind other */\n}\n<\u002Fstyle>\n<style>\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;}\n  body{font-family:'Vazirmatn',sans-serif;background:#F5F7FA;color:#1F2A38;-webkit-font-smoothing:antialiased;}\n  button{font-family:inherit;cursor:pointer;border:none;background:none;}\n  input,select,textarea{font-family:inherit;}\n  ::-webkit-scrollbar{width:10px;height:10px;}\n  ::-webkit-scrollbar-thumb{background:#C2CCD9;border-radius:999px;border:2px solid #F5F7FA;background-clip:content-box;}\n  ::-webkit-scrollbar-track{background:transparent;}\n  @keyframes clinFade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}\n  @keyframes clinToast{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:none;}}\n  @keyframes clinBar{from{height:0;}to{}}\n  .clin-navitem:hover{background:rgba(255,255,255,.07)!important;}\n  .clin-row:hover{background:#F5F7FA!important;}\n  .clin-btn-primary:hover{background:#005BAC!important;}\n  .clin-btn-ghost:hover{background:#EDF1F6!important;}\n  .clin-card-i:hover{box-shadow:0 4px 12px rgba(15,43,70,.08),0 2px 4px rgba(15,43,70,.04)!important;transform:translateY(-2px);}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div dir=\"rtl\" style=\"display:flex;min-height:100vh;width:100%;font-family:'Vazirmatn',sans-serif;background:#F5F7FA;\">\n\n  <!-- ============ SIDEBAR ============ -->\n  <aside style=\"width:262px;flex:0 0 262px;background:#0F2B46;color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;\">\n    <div style=\"padding:22px 22px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08);\">\n      <div style=\"width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#0066B3,#3385CC);display:flex;align-items:center;justify-content:center;flex:0 0 42px;box-shadow:0 4px 10px rgba(0,102,179,.4);\">\n        <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M11 2a2 2 0 0 0-2 2v5H4a2 2 0 0 0-2 2v2c0 1.1.9 2 2 2h5v5c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2v-5h5a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2h-5V4a2 2 0 0 0-2-2h-2z\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"line-height:1.25;\">\n        <div style=\"font-weight:700;font-size:15.5px;\">مرکز جراحی<\u002Fdiv>\n        <div style=\"font-size:11px;color:#97A4B5;font-weight:500;\">سامانه مدیریت یکپارچه<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <nav style=\"flex:1;overflow-y:auto;padding:12px 12px 20px;display:flex;flex-direction:column;gap:2px;\">\n      <sc-for list=\"{{ navItems }}\" as=\"item\" hint-placeholder-count=\"12\">\n        <button class=\"clin-navitem\" onclick=\"{{ item.go }}\" style=\"{{ item.style }}\">\n          <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:0 0 19px;\"><path d=\"{{ item.icon }}\"><\u002Fpath><\u002Fsvg>\n          <span style=\"flex:1;text-align:right;\">{{ item.label }}<\u002Fspan>\n          <sc-if value=\"{{ item.badge }}\" hint-placeholder-val=\"\">\n            <span style=\"background:#EB2D4B;color:#fff;font-size:10.5px;font-weight:700;min-width:18px;height:18px;padding:0 5px;border-radius:999px;display:flex;align-items:center;justify-content:center;\">{{ item.badge }}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fnav>\n\n    <div style=\"padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:11px;\">\n      <div style=\"width:36px;height:36px;border-radius:999px;background:#1E4B73;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex:0 0 36px;\">ح‌ن<\u002Fdiv>\n      <div style=\"flex:1;line-height:1.3;min-width:0;\">\n        <div style=\"font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">حسن نظری<\u002Fdiv>\n        <div style=\"font-size:11px;color:#97A4B5;\">مدیر مرکز<\u002Fdiv>\n      <\u002Fdiv>\n      <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#97A4B5\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4 M16 17l5-5-5-5 M21 12H9\"><\u002Fpath><\u002Fsvg>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <!-- ============ MAIN ============ -->\n  <div style=\"flex:1;display:flex;flex-direction:column;min-width:0;\">\n\n    <!-- HEADER -->\n    <header style=\"height:66px;flex:0 0 66px;background:#fff;border-bottom:1px solid #DCE3EC;display:flex;align-items:center;gap:18px;padding:0 28px;position:sticky;top:0;z-index:50;\">\n      <div style=\"flex:1;min-width:0;\">\n        <div style=\"font-size:11px;color:#6B7888;font-weight:500;margin-bottom:1px;\">{{ crumb }}<\u002Fdiv>\n        <div style=\"font-size:18px;font-weight:700;color:#0F2B46;\">{{ pageTitle }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:relative;width:280px;max-width:34vw;\">\n        <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#97A4B5\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"position:absolute;right:11px;top:50%;transform:translateY(-50%);\"><circle cx=\"11\" cy=\"11\" r=\"8\"><\u002Fcircle><path d=\"m21 21-4.3-4.3\"><\u002Fpath><\u002Fsvg>\n        <input value=\"{{ globalSearch }}\" oninput=\"{{ onGlobalSearch }}\" placeholder=\"جستجوی سریع در کل سامانه…\" style=\"width:100%;height:40px;border:1px solid #DCE3EC;border-radius:8px;padding:0 38px 0 14px;font-size:13px;background:#F5F7FA;color:#1F2A38;outline:none;\">\n      <\u002Fdiv>\n      <button class=\"clin-btn-ghost\" style=\"width:40px;height:40px;border-radius:8px;background:#F5F7FA;display:flex;align-items:center;justify-content:center;position:relative;color:#36424F;\">\n        <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9 M10.3 21a1.94 1.94 0 0 0 3.4 0\"><\u002Fpath><\u002Fsvg>\n        <span style=\"position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:999px;background:#EB2D4B;border:1.5px solid #fff;\"><\u002Fspan>\n      <\u002Fbutton>\n      <button class=\"clin-btn-primary\" onclick=\"{{ goAdd }}\" style=\"height:40px;padding:0 16px;border-radius:8px;background:#0066B3;color:#fff;font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px;box-shadow:0 1px 2px rgba(15,43,70,.12);\">\n        <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5v14 M5 12h14\"><\u002Fpath><\u002Fsvg>\n        افزودن\n      <\u002Fbutton>\n    <\u002Fheader>\n\n    <!-- CONTENT -->\n    <main style=\"flex:1;padding:26px 28px 40px;overflow-x:hidden;\">\n\n      <!-- ===== DASHBOARD ===== -->\n      <sc-if value=\"{{ isDashboard }}\" hint-placeholder-val=\"{{ true }}\">\n        <div data-screen-label=\"داشبورد\">\n          <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px;\">\n            <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n              <div style=\"background:#fff;border:1px solid #DCE3EC;border-radius:12px;padding:18px 18px 16px;box-shadow:0 1px 2px rgba(15,43,70,.06);\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;\">\n                  <span style=\"font-size:12.5px;color:#6B7888;font-weight:500;\">{{ k.label }}<\u002Fspan>\n                  <span style=\"width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:{{ k.iconBg }};color:{{ k.iconColor }};\">\n                    <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{ k.icon }}\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:23px;font-weight:800;color:#0F2B46;letter-spacing:-.5px;\">{{ k.value }}<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:5px;margin-top:7px;font-size:12px;font-weight:600;color:{{ k.deltaColor }};\">\n                  <span>{{ k.delta }}<\u002Fspan><span style=\"color:#97A4B5;font-weight:500;\">{{ k.deltaNote }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:16px;\">\n            <!-- profit chart -->\n            <div style=\"background:#fff;border:1px solid #DCE3EC;border-radius:12px;padding:20px 22px;box-shadow:0 1px 2px rgba(15,43,70,.06);\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;\">\n                <div>\n                  <div style=\"font-size:15px;font-weight:700;color:#0F2B46;\">روند درآمد و هزینه<\u002Fdiv>\n                  <div style=\"font-size:12px;color:#6B7888;margin-top:2px;\">شش ماه گذشته — میلیون ریال<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:16px;\">\n                  <span style=\"display:flex;align-items:center;gap:6px;font-size:12px;color:#4D5A6B;\"><span style=\"width:11px;height:11px;border-radius:3px;background:#0066B3;\"><\u002Fspan>درآمد<\u002Fspan>\n                  <span style=\"display:flex;align-items:center;gap:6px;font-size:12px;color:#4D5A6B;\"><span style=\"width:11px;height:11px;border-radius:3px;background:#F5A623;\"><\u002Fspan>هزینه<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              {{ profitChart }}\n            <\u002Fdiv>\n            <!-- commission breakdown -->\n            <div style=\"background:#fff;border:1px solid #DCE3EC;border-radius:12px;padding:20px 22px;box-shadow:0 1px 2px rgba(15,43,70,.06);\">\n              <div style=\"font-size:15px;font-weight:700;color:#0F2B46;margin-bottom:3px;\">ترکیب هزینه‌ها<\u002Fdiv>\n              <div style=\"font-size:12px;color:#6B7888;margin-bottom:18px;\">اردیبهشت ۱۴۰۵<\u002Fdiv>\n              <sc-for list=\"{{ costBreakdown }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <div style=\"margin-bottom:15px;\">\n                  <div style=\"display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;\">\n                    <span style=\"color:#36424F;font-weight:500;\">{{ c.label }}<\u002Fspan>\n                    <span style=\"color:#0F2B46;font-weight:700;\">{{ c.value }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style solid ${active?'#0066B3':'transparent'};transition:all .15s;white-space:nowrap;`;\n  }\n}\n<\u002Fscript>\n<script>\n(async () => {\n  // Prepend so page-supplied @page / break rules (deck-stage's margin:0,\n  // author CSS) keep source-order precedence over the baseline.\n  const baseCss = document.createElement('style');\n  baseCss.textContent = \"@media print {\\n  @page { margin: 0.5cm; }\\n  html, body { print-color-adjust: exact; -webkit-print-color-adjust: exact; }\\n  section, article, figure, table { break-inside: avoid; }\\n  *, *::before, *::after {\\n    animation-delay: -99s !important; animation-duration: .001s !important;\\n    animation-iteration-count: 1 !important; animation-fill-mode: both !important;\\n    animation-play-state: running !important; transition-duration: 0s !important;\\n  }\\n}\";\n  document.head.prepend(baseCss);\n  if (document.readyState === 'loading') {\n    await new Promise((r) => document.addEventListener('DOMContentLoaded', r, { once: true }));\n  }\n  let ds = document.querySelector('deck-stage');\n  // whenDefined never resolves when nothing registers the element, so only\n  // await it when a <deck-stage> tag exists (and race a timeout regardless).\n  if (ds && !customElements.get('deck-stage')) {\n    try {\n      await Promise.race([\n        customElements.whenDefined('deck-stage'),\n        new Promise((r) => setTimeout(r, 3000)),\n      ]);\n    } catch (e) {}\n    ds = document.querySelector('deck-stage');\n  }\n  // dc-runtime assigns window.DCLogic at init and mounts into #dc-root on\n  // DOMContentLoaded; settle on that subtree so React has rendered before\n  // print(). Non-DC pages fall through to weighing body.\n  const isDc = !ds && 'DCLogic' in window;\n  const settleRoot = ds || (isDc ? document.getElementById('dc-root') : null) || document.body;\n  if (settleRoot) {\n    // Weigh only content children — skip script/style/template so inline\n    // Babel/CSS doesn't register as stable \"content\" before the framework\n    // has mounted anything.\n    const MEDIA = 'img,svg,canvas,video,picture,iframe,embed,object';\n    const weigh = () => {\n      let text = 0, media = 0;\n      for (const c of settleRoot.children) {\n        const t = c.tagName;\n        if (t === 'SCRIPT' || t === 'STYLE' || t === 'TEMPLATE') continue;\n        text += (c.textContent || '').trim().length;\n        media += c.querySelectorAll(MEDIA).length + (c.matches(MEDIA) ? 1 : 0);\n      }\n      return text + media * 100;\n    };\n    // \"Non-zero and stable\" alone is not sufficient to mean rendered: generic\n    // body can carry a static shell while async main content is pending, and\n    // #dc-root can carry the root DC's static text while child refs are still\n    // .sc-placeholder boxes. Gate generic on readyState 'complete', and never\n    // accept stability while a dc-runtime placeholder is present.\n    const isGeneric = settleRoot === document.body;\n    const deadline = Date.now() + 15000;\n    let last = -1, stable = 0;\n    while (Date.now() < deadline) {\n      const n = weigh();\n      const ready =\n        (!isGeneric || document.readyState === 'complete') &&\n        !settleRoot.querySelector('.sc-placeholder');\n      if (n > 0 && n === last && ready) { if (++stable >= 2) break; } else { stable = 0; }\n      last = n;\n      await new Promise((r) => setTimeout(r, 250));\n    }\n  }\n  try { await document.fonts.ready; } catch (e) {}\n  // Jump every animation to its end state so print() never captures a slide\n  // mid-entrance. Ordering matters: the 0s-transition style must be live\n  // BEFORE data-deck-active is set so attribute-keyed transitions don't\n  // start a (now-0s) run from the pre-active base.\n  const st = document.createElement('style');\n  st.textContent = '*,*::before,*::after{animation-delay:-99s !important;animation-duration:.001s !important;animation-iteration-count:1 !important;animation-fill-mode:both !important;animation-play-state:running !important;transition-duration:0s !important}';\n  document.head.appendChild(st);\n  for (const d of document.querySelectorAll('deck-stage')) {\n    for (const c of d.children) {\n      const t = c.tagName;\n      if (t === 'SCRIPT' || t === 'STYLE' || t === 'TEMPLATE') continue;\n      c.setAttribute('data-deck-active', '');\n    }\n  }\n  try {\n    const sweep = () => {\n      for (const a of document.getAnimations()) {\n        try { a.finish(); } catch (e) {\n          try { a.currentTime = (a.effect && a.effect.getComputedTiming().duration) || 0; a.pause(); } catch (e2) {}\n        }\n      }\n    };\n    sweep();\n    await new Promise((r) => requestAnimationFrame(r));\n    sweep();\n    await new Promise((r) => requestAnimationFrame(r));\n  } catch (e) {}\n  setTimeout(() => { try { window.print(); } catch (e) {} }, 200);\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
