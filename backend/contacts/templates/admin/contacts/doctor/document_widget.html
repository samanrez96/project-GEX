{% if widget.is_initial %}
  {% if widget.preview_url %}
    <div class="doc-preview">
      <img src="{{ widget.preview_url }}" alt="{{ widget.initial_text }}" class="doc-preview-thumb">
      <a href="{{ widget.preview_url }}" target="_blank" rel="noopener noreferrer" class="doc-preview-link">مشاهده فایل</a>
    </div>
  {% endif %}
  {% if not widget.required %}
    <span class="doc-clear-row">
      <input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}"{% if widget.attrs.disabled %} disabled{% endif %}{% if widget.attrs.checked %} checked{% endif %}>
      <label for="{{ widget.checkbox_id }}">{{ widget.clear_checkbox_label }}</label>
    </span>
  {% endif %}
  <br>
  <span class="doc-input-label">{{ widget.input_text }}:</span>
{% else %}
  <div class="doc-preview doc-preview--empty">ثبت نشده</div>
{% endif %}
<input type="{{ widget.type }}" name="{{ widget.name }}"{% include "django/forms/widgets/attrs.html" %}>
